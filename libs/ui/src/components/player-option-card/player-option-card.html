<div class="player-card">
  <!-- Header -->
  <div class="card-header">
    <div class="header-top-row">
      <div class="position-avatar">{{ option().player.position }}</div>
      <span class="status-badge trending" *ngIf="option().isTrending">Trending</span>
      <span class="status-badge popular" *ngIf="!option().isTrending && option().isPopular">Popular</span>
    </div>
    <h3 class="player-name">{{ option().player.name }}</h3>
    <p class="player-meta">{{ option().player.position }} · {{ option().player.age }} years old</p>
  </div>

  <!-- Content -->
  <div class="card-content">
    <p class="option-description">{{ option().description }}</p>

    <div class="bottom-section">
      <div class="votes-row">
        <span class="votes-label">Current Votes</span>
        <span class="votes-count">{{ option().votes }}</span>
      </div>

      <div class="vote-control">
        <div class="stepper-row">
          <button class="stepper-btn" (click)="decrement()">−</button>
          <input
            class="stepper-input"
            type="number"
            min="1"
            inputmode="numeric"
            [(ngModel)]="voteAmount"
            (change)="onAmountChange()"
          />
          <button class="stepper-btn" (click)="increment()">+</button>
        </div>
        <button class="cast-btn" [disabled]="!voteAmount || voteAmount < 1" (click)="applyVote()">
          Cast Votes
        </button>
      </div>
    </div>
  </div>
</div>
