<div class="player-card">
  <div class="player-header">
    <div class="player-avatar"></div>

    <div class="player-info">
      <div class="player-name">{{ option().player.name }}</div>
      <div class="player-sub">{{ option().player.position }}</div>
      <div class="player-team">Age: {{ option().player.age }}</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="votes-section">
    <div class="votes-left">
      <div class="votes-number">{{ option().votes }}</div>
      <div class="votes-label">votes</div>
    </div>
    <button class="vote-btn" (click)="selected.emit(option())">Vote</button>
  </div>

  <div class="card-footer">
    <button class="edit-btn">Edit</button>
    <button class="remove-btn">Remove</button>
  </div>
</div>
