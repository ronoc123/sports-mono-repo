<div class="notification-item" [class.unread]="!notification().isRead">
  <div class="content">
    <strong>{{ notification().title }}</strong>
    <p>{{ notification().message }}</p>
  </div>

  <button
    *ngIf="!notification().isRead"
    class="mark-read"
    (click)="markRead.emit(notification().notificationId)"
  >
    Mark as read
  </button>
</div>
