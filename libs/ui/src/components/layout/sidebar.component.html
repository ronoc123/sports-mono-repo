<!-- Sidebar Wrapper -->
<div class="sidebar-container">
  <!-- Organization Selector -->
  <div class="organization-selector">
    <button class="organization-dropdown-trigger">
      <div class="selected-org">
        <img [src]="'test'" [alt]="'test'" class="org-logo" />
        <span class="org-name">Rams</span>
      </div>
    </button>
  </div>

  <!-- User Info Section -->
  <div class="user-info-section">
    <div class="user-avatar">
      {{ (currentUser()?.firstName || "U").substring(0, 1).toUpperCase() }}
    </div>
    <div class="user-details">
      <span class="user-name">{{ currentUser()?.firstName || "User" }}</span>
      <span class="user-email">{{ currentUser()?.email }}</span>
    </div>
  </div>
  <mat-divider></mat-divider>
  <!-- Navigation Menu -->
  <div class="navigation-menu">
    <mat-tree
      [dataSource]="dataSource"
      [treeControl]="treeControl"
      class="nav-tree"
    >
      <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
        <button
          mat-button
          (click)="navigateTo(node.route)"
          [class.active-route]="isSelected(node.route)"
          class="nav-item"
        >
          <mat-icon class="nav-icon">{{ node.icon }}</mat-icon>
          <span class="nav-text">{{ node.name }}</span>
        </button>
      </mat-tree-node>

      <mat-tree-node *matTreeNodeDef="let node; when" matTreeNodePadding>
        <div class="expandable-node">
          <button mat-icon-button matTreeNodeToggle class="toggle-button">
            <mat-icon class="toggle-icon">
              {{
                treeControl.isExpanded(node) ? "expand_more" : "chevron_right"
              }}
            </mat-icon>
          </button>

          <button
            mat-button
            (click)="navigateTo(node.route)"
            [class.active-route]="isSelected(node.route)"
            class="nav-item expandable"
          >
            <mat-icon *ngIf="node.icon" class="nav-icon">{{
              node.icon
            }}</mat-icon>
            <span class="nav-text">{{ node.name }}</span>
          </button>
        </div>
      </mat-tree-node>
    </mat-tree>
  </div>

  <!-- Quick Actions -->
  <div class="quick-actions">
    <mat-divider></mat-divider>
    <div class="actions-header">
      <mat-icon>flash_on</mat-icon>
      <span>Quick Actions</span>
    </div>
    <button mat-button class="action-button" (click)="navigateTo('/redeem')">
      <mat-icon>redeem</mat-icon>
      <span>Redeem Code</span>
    </button>
    <button
      mat-button
      class="action-button"
      (click)="navigateTo('/player-option')"
    >
      <mat-icon>how_to_vote</mat-icon>
      <span>Vote</span>
    </button>
  </div>

  <!-- Footer -->
  <div class="sidebar-footer">
    <div class="app-info">
      <mat-icon class="footer-icon">sports</mat-icon>
      <div class="app-details">
        <span class="app-name">Sports UI</span>
        <span class="app-version">v1.0.0</span>
      </div>
    </div>
  </div>
</div>
