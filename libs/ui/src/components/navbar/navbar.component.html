<mat-toolbar class="navbar">
  <div class="navbar-left">
    <div class="sidebar-footer">
      <div class="app-info">
        <mat-icon class="footer-icon">sports</mat-icon>
      </div>
    </div>

    <!-- Sidebar Toggle -->
    <button mat-icon-button (click)="toggleNavBar.emit()" class="menu-button">
      <mat-icon>menu</mat-icon>
    </button>
  </div>

  <div class="navbar-right">
    <!-- User Menu -->
    <div class="user-section" *ngIf="user()">
      <!-- <button mat-button [matMenuTriggerFor]="userMenu" class="user-button"> -->
      <button mat-button class="user-button">
        <div class="user-info-section">
          <div class="user-avatar">
            {{ (user()?.firstName || "U").substring(0, 1).toUpperCase() }}
          </div>
        </div>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu" class="user-menu">
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="openProfile.emit()">
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item (click)="openSettings.emit()">
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout.emit()" class="logout-item">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>
  </div>
</mat-toolbar>
