<header class="navbar">

  <!-- Left: brand -->
  <div class="navbar-left">
    <div class="brand">Sportify</div>
  </div>

  <!-- Right: actions -->
  <div class="navbar-right">

    <!-- Balance chip -->
    <div class="balance-chip" *ngIf="user()">
      <span class="material-icons balance-chip-icon">toll</span>
      <span class="balance-chip-value">{{ balance() | number }}</span>
      <span class="balance-chip-label">{{ currencyName() }}</span>
    </div>

    <!-- Buy Points CTA -->
    <button class="buy-votes-btn" (click)="buyVotes.emit()">
      <span class="material-icons">shopping_cart</span>
      Get {{ currencyName() }}
    </button>

    <!-- Notifications -->
    <lib-notification-badge
      [notifications]="notifications()"
      (markRead)="markRead.emit($event)"
    ></lib-notification-badge>

    <!-- User avatar + dropdown -->
    <div class="user-menu-wrap" *ngIf="user()">
      <button class="user-avatar-btn" (click)="toggleUserMenu()">
        {{ userInitial }}
      </button>

      <!-- Dropdown -->
      <div class="user-dropdown" *ngIf="userMenuOpen()">
        <div class="user-dropdown-header">
          <div class="dropdown-avatar">{{ userInitial }}</div>
          <div class="dropdown-user-info">
            <span class="dropdown-name">{{ user()?.firstName || 'User' }}</span>
            <span class="dropdown-email">{{ user()?.email }}</span>
          </div>
        </div>
        <div class="user-dropdown-divider"></div>
        <button class="dropdown-item" (click)="openProfile.emit(); closeUserMenu()">
          <span class="material-icons">person</span>
          Profile
        </button>
        <button class="dropdown-item" (click)="openSettings.emit(); closeUserMenu()">
          <span class="material-icons">settings</span>
          Settings
        </button>
        <div class="user-dropdown-divider"></div>
        <button class="dropdown-item dropdown-item--danger" (click)="logout.emit(); closeUserMenu()">
          <span class="material-icons">logout</span>
          Logout
        </button>
      </div>
    </div>

  </div>
</header>

<!-- Click-outside overlay -->
<div class="menu-overlay" *ngIf="userMenuOpen()" (click)="closeUserMenu()"></div>
