<div class="backdrop" *ngIf="isOpen()" (click)="onBackdropClick()">
  <div class="modal" [ngClass]="width()" (click)="$event.stopPropagation()">
    <header *ngIf="title()" class="modal-header">
      <h2>{{ title() }}</h2>
      <button (click)="close.emit()">×</button>
    </header>

    <section class="modal-body">
      <ng-container
        *ngIf="content()"
        [ngTemplateOutlet]="content()"
        [ngTemplateOutletContext]="context()"
      ></ng-container>
    </section>
  </div>
</div>
