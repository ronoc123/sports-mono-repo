<div class="sidebar-container">
  <!-- Org Selector -->
  <div class="sidebar-top">
    <lib-organization-badge
      [organizations]="organizations()"
      [selectedOrg]="selectedOrganization()"
      (selectOrganization)="onOrgSelected.emit($event)"
    ></lib-organization-badge>

    <!-- User snippet -->
    <div class="user-snippet" *ngIf="user()">
      <div class="user-avatar">
        {{
          (user()?.firstName || user()?.email || "U")
            .substring(0, 1)
            .toUpperCase()
        }}
      </div>
      <div class="user-detail">
        <span class="user-email">{{ user()?.email }}</span>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="nav-list">
    <ng-container *ngFor="let item of navItems()">
      <!-- Leaf item (no children) -->
      <button
        *ngIf="!item.children?.length"
        class="nav-item"
        [class.nav-item--active]="isActive(item)"
        (click)="onNavSelected.emit(item)"
      >
        <span class="material-icons nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.name }}</span>
      </button>

      <!-- Group item (has children) -->
      <div *ngIf="item.children?.length" class="nav-group">
        <button
          class="nav-item nav-item--group"
          [class.nav-item--group-active]="hasActiveChild(item)"
          [class.nav-item--group-open]="isExpanded(item.name)"
          (click)="toggleExpand(item.name)"
        >
          <span class="material-icons nav-icon">{{ item.icon }}</span>
          <span class="nav-label">{{ item.name }}</span>
          <span
            class="material-icons expand-arrow"
            [class.expand-arrow--open]="isExpanded(item.name)"
          >
            chevron_right
          </span>
        </button>

        <div class="nav-children" *ngIf="isExpanded(item.name)">
          <button
            *ngFor="let child of item.children"
            class="nav-item nav-item--child"
            [class.nav-item--active]="isActive(child)"
            (click)="onNavSelected.emit(child)"
          >
            <span class="nav-child-dot"></span>
            <span class="material-icons nav-icon nav-icon--child">{{
              child.icon
            }}</span>
            <span class="nav-label">{{ child.name }}</span>
          </button>
        </div>
      </div>
    </ng-container>
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <span class="footer-brand">Sportify</span>
  </div>
</div>
