<!-- Sidebar Wrapper -->
<div class="sidebar-container">
  <!-- Organization Selector -->
  <lib-organization-badge
    [organizations]="organizations()"
    [selectedOrg]="selectedOrganization()"
    (selectOrganization)="onOrgSelected.emit($event)"
  >
  </lib-organization-badge>

  <!-- User Info Section (UI only, no service access) -->
  <div class="user-info-section" *ngIf="user()">
    <div class="user-avatar">
      {{ (user()?.firstName || "U").substring(0, 1).toUpperCase() }}
    </div>
    <div class="user-details">
      <span class="user-email">{{ user()?.email }}</span>
    </div>
  </div>

  <mat-divider></mat-divider>

  <!-- Navigation Menu -->
  <div class="navigation-menu">
    <mat-tree
      [dataSource]="dataSource"
      [treeControl]="treeControl"
      class="nav-tree"
    >
      <!-- Leaf node -->
      <mat-tree-node
        *matTreeNodeDef="let node; when: isLeaf"
        matTreeNodePadding
      >
        <button
          mat-button
          (click)="onNavSelected.emit(node)"
          [class.active-route]="currentRoute() === node.route"
          class="nav-item"
        >
          <mat-icon class="nav-icon">{{ node.icon }}</mat-icon>
          <span class="nav-text">{{ node.name }}</span>
        </button>
      </mat-tree-node>
      <!-- Expandable node -->
      <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
        <div class="expandable-node">
          <button mat-icon-button matTreeNodeToggle class="toggle-button">
            <mat-icon class="toggle-icon">
              {{
                treeControl.isExpanded(node) ? "expand_more" : "chevron_right"
              }}
            </mat-icon>
          </button>
          <button
            mat-button
            (click)="onNavSelected.emit(node)"
            [class.active-route]="currentRoute() === node.route"
            class="nav-item expandable"
          >
            <mat-icon *ngIf="node.icon" class="nav-icon">
              {{ node.icon }}
            </mat-icon>
            <span class="nav-text">{{ node.name }}</span>
          </button>
        </div>

        <!-- Children -->
        <div class="child-container">
          <ng-container matTreeNodeOutlet></ng-container>
        </div>
      </mat-nested-tree-node>
    </mat-tree>
  </div>

  <!-- Footer -->
  <div class="sidebar-footer">
    <div class="app-info">
      <mat-icon class="footer-icon">sports</mat-icon>
      <div class="app-details">
        <span class="app-name">Sportify</span>
      </div>
    </div>
  </div>
</div>
