<form class="form">
  <lib-ui-input label="First Name">
    <input class="input" formControlName="firstName" />
  </lib-ui-input>
  <lib-ui-input label="Last Name">
    <input class="input" formControlName="lastName" />
  </lib-ui-input>
  <lib-ui-input label="Email">
    <input class="input" formControlName="email" />
  </lib-ui-input>
  <lib-ui-input label="Phone">
    <input class="input" formControlName="phone" />
  </lib-ui-input>
</form>
