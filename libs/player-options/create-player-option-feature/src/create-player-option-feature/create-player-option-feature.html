<h1>Player Options</h1>
<lib-ui-searchbar (search)="onSearch($event)"></lib-ui-searchbar>
<div class="options-container">
  <ng-container *ngIf="(filteredPlayers() || []).length === 0">
    <div class="empty-state">No players found.</div>
  </ng-container>

  <lib-create-player-option-card
    *ngFor="let p of filteredPlayers()"
    (selected)="open($event)"
    [player]="p"
  ></lib-create-player-option-card>
</div>

<ng-template #playerModal let-player="player" let-submit="submit">
  <form
    #f="ngForm"
    (ngSubmit)="submit({ 
  title: f.value.title, 
  description: f.value.description,
  player 
})"
  >
    <div class="modal-content">
      <h3>{{ player.name }}</h3>

      <lib-ui-input label="Title">
        <input type="text" name="title" ngModel required />
      </lib-ui-input>

      <lib-ui-input label="Description">
        <input type="text" name="description" ngModel />
      </lib-ui-input>
    </div>

    <footer class="modal-footer">
      <button type="button" (click)="modal.close()">Cancel</button>
      <button type="submit" class="primary">Confirm</button>
    </footer>
  </form>
</ng-template>
