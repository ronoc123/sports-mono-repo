<div class="page-header">
  <div class="page-title-block">
    <h1 class="page-title">Player Options</h1>
    <p class="page-subtitle">Vote on potential roster moves for the upcoming season.</p>
  </div>
  <div class="page-actions">
    <lib-ui-searchbar (search)="onSearch($event)"></lib-ui-searchbar>
  </div>
</div>

<div class="options-container">
  <div *ngFor="let po of paginatedOptions()">
    <lib-player-option-card
      (vote)="onSelectOption($event)"
      [option]="po"
    ></lib-player-option-card>
  </div>
</div>

<!-- Pagination -->
@if (totalPages() > 1) {
<div class="po-pagination">
  <button class="po-page-btn" [disabled]="currentPage() === 1" (click)="goToPage(currentPage() - 1)">‹</button>
  @for (page of pageNumbers(); track $index) {
    @if (page === -1) {
      <span class="po-page-ellipsis">…</span>
    } @else {
      <button class="po-page-btn" [class.po-page-btn--active]="page === currentPage()" (click)="goToPage(page)">{{ page }}</button>
    }
  }
  <button class="po-page-btn" [disabled]="currentPage() === totalPages()" (click)="goToPage(currentPage() + 1)">›</button>
</div>
}
