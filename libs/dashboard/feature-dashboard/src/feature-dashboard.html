<div class="dashboard">

  <!-- Welcome Banner -->
  <div class="welcome-banner">
    <div class="welcome-text">
      <h1 class="welcome-heading">Welcome back, {{ currentUser()?.firstName || currentUser()?.email || 'User' }}!</h1>
      <p class="welcome-sub">Here's what's happening in your organization today.</p>
    </div>
    <div class="welcome-deco" aria-hidden="true">
      <div class="deco-grid">
        <div class="deco-square"></div>
        <div class="deco-square"></div>
        <div class="deco-square"></div>
        <div class="deco-square"></div>
      </div>
    </div>
  </div>

  <!-- Overview -->
  <section class="section">
    <h2 class="section-heading">Overview</h2>
    <div class="stats-grid">
      <div
        *ngFor="let card of statsCards"
        class="stat-card"
        [class]="'stat-card stat-card--' + card.color"
      >
        <div class="stat-body">
          <div class="stat-top">
            <div class="stat-icon-wrap">
              <span class="material-icons">{{ card.icon }}</span>
            </div>
          </div>
          <p class="stat-label">{{ card.title }}</p>
          <h3 class="stat-value">{{ card.value }}</h3>
          <p class="stat-sub" *ngIf="card.subtitle">{{ card.subtitle }}</p>
        </div>
        <div class="stat-footer" *ngIf="card.action">
          <button class="stat-link" (click)="navigateTo(card.action.route)">
            {{ card.action.label }}
            <span class="material-icons stat-link-arrow">arrow_forward</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Quick Actions -->
  <section class="section">
    <h2 class="section-heading">Quick Actions</h2>
    <div class="actions-grid">
      <button
        *ngFor="let action of quickActions"
        class="action-btn"
        (click)="navigateTo(action.route)"
      >
        <span class="material-icons action-icon">{{ action.icon }}</span>
        <span class="action-label">{{ action.label }}</span>
      </button>
    </div>
  </section>

</div>
