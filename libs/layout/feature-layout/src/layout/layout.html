<lib-ui-navbar
  class="navbar"
  [config]="layoutConfig"
  [user]="user()"
  [notifications]="notifications()"
  [balance]="pointsBalance()"
  currencyName="Points"
  (toggleNavBar)="onToggleSidebar()"
  (toggleTheme)="onToggleTheme()"
  (logout)="onLogout()"
  (openProfile)="onOpenProfile()"
  (markRead)="onMarkRead($event)"
  (buyVotes)="onBuyVotes()"
></lib-ui-navbar>

<div class="layout-body">
  <!-- Mobile overlay -->
  <div
    class="mobile-overlay"
    [class.mobile-overlay--visible]="mobileSidebarOpen()"
    (click)="closeMobileSidebar()"
  ></div>

  <aside class="sidebar" [class.sidebar--open]="mobileSidebarOpen()">
    <lib-ui-sidebar
      [navItems]="navItems()"
      [user]="user()"
      [currentRoute]="router.url"
      [organizations]="organizations()"
      [selectedOrganization]="selectedOrganization()"
      (onOrgSelected)="onSelectOrg($event)"
      (onNavSelected)="onNavItemClick($event)"
    ></lib-ui-sidebar>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>

<lib-toast-feature />
