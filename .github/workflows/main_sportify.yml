name: Build and deploy Sports API to Azure Web App - sportify

on:
  push:
    branches:
      - main
    paths:
      - 'services/sportsAPI/**'
      - 'services/SportifyCore/**'
      - 'services/Messaging/**'
      - 'services/MessagingService/**'
      - '.github/workflows/main_sportify.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-sportsapi-${{ hashFiles('services/sportsAPI/**/*.csproj', 'services/SportifyCore/**/*.csproj', 'services/Messaging/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-sportsapi-

      # Write RSA public key from GitHub Secret so the app can validate JWTs at runtime
      - name: Write RSA public key
        run: |
          mkdir -p services/sportsAPI/WebAPI/Keys
          echo "${{ secrets.RSA_PUBLIC_KEY }}" > services/sportsAPI/WebAPI/Keys/public.pem

      - name: Publish Sports API
        run: dotnet publish services/sportsAPI/WebAPI/WebAPI.csproj -c Release -o publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: sports-api
          path: publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sports-api
          path: publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_54E60D45F5504EB8972891B865F0B929 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_43B3188FF4EF48218B4BB2C01C86CF51 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AAB9C5D964CA4FB3B5188BB93C2FF254 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sportify'
          package: publish
