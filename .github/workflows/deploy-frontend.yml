name: Build and deploy Angular UI to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Nx affected commands need full git history
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npx nx build sports-ui --configuration=production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sports-ui
          # Nx outputs to dist/apps/sports-ui by default — verify this matches your nx.json outputPath
          path: dist/apps/sports-ui

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sports-ui
          path: dist/apps/sports-ui

      # Azure Static Web Apps deployment
      # Prerequisites:
      #   1. Create an Azure Static Web App in the Azure portal (or via az CLI)
      #   2. Copy the deployment token from the Static Web App resource
      #   3. Add it as a GitHub Secret named AZURE_STATIC_WEB_APPS_API_TOKEN
      - name: Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist/apps/sports-ui'
          # Angular handles its own routing — no separate API location
          api_location: ''
          output_location: ''
          skip_app_build: true   # we already built above
