name: Build and deploy Angular UI to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "libs/**"
      - "package.json"
      - "package-lock.json"
      - "nx.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Removed cache: 'npm' — we cache node_modules directly below (faster)

      # Cache the entire node_modules folder keyed on package-lock.json.
      # On a cache hit the install step is skipped completely — saves ~15-20 min.
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      # Cache the Nx computation cache — skips rebuilding libs that haven't changed
      - name: Cache Nx build cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('nx.json', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('nx.json', 'package-lock.json') }}-
            ${{ runner.os }}-nx-

      - name: Build Angular app
        run: npx nx build sports-ui --configuration=production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sports-ui
          path: dist/apps/sports-ui

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sports-ui
          path: dist/apps/sports-ui

      - name: Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_SAND_0FCE9DC0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist/apps/sports-ui"
          api_location: ""
          output_location: ""
          skip_app_build: true
