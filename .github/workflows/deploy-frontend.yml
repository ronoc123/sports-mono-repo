name: Build and deploy Angular UI to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "libs/**"
      - "package.json"
      - "yarn.lock"
      - "nx.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Cache node_modules keyed on yarn.lock — skips install entirely on cache hit
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: yarn install

      # Cache Nx computation cache — skips rebuilding libs that haven't changed
      - name: Cache Nx build cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('nx.json', 'yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('nx.json', 'yarn.lock') }}-
            ${{ runner.os }}-nx-

      - name: Inject environment variables
        run: |
          ENV_FILE="libs/core/api-types/src/lib/environments/environment.prod.ts"
          sed -i "s|__SPORTS_API_URL__|${{ vars.SPORTS_API_URL }}|g" $ENV_FILE
          sed -i "s|__IDENTITY_API_URL__|${{ vars.IDENTITY_API_URL }}|g" $ENV_FILE
          sed -i "s|__GOOGLE_CLIENT_ID__|${{ secrets.GOOGLE_CLIENT_ID }}|g" $ENV_FILE
          sed -i "s|__STRIPE_PUBLIC_KEY__|${{ secrets.STRIPE_PUBLIC_KEY }}|g" $ENV_FILE

      - name: Build Angular app
        run: npx nx build sports-ui --configuration=production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sports-ui
          path: dist/apps/sports-ui/browser

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sports-ui
          path: dist/apps/sports-ui/browser

      - name: Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_SAND_0FCE9DC0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist/apps/sports-ui/browser"
          api_location: ""
          output_location: ""
          skip_app_build: true
