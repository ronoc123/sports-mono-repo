name: Build and deploy Identity API

on:
  push:
    branches: [ main ]
    paths:
      - 'services/IdentityService/**'
      - 'services/SportifyCore/**'
      - '.github/workflows/deploy-identity.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # 🔍 DEBUG: show repo root
      - name: Debug repo root
        run: dir

      # 🔍 DEBUG: show services folder
      - name: Debug services folder
        run: dir services

      # 🔍 DEBUG: show IdentityService recursively (THIS IS THE IMPORTANT ONE)
      - name: Debug IdentityService structure
        run: dir services\IdentityService /s

