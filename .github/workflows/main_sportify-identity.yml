name: Build and deploy Identity API

on:
  push:
    branches: [ main ]
    paths:
      - 'services/IdentityService/**'
      - 'services/SportifyCore/**'
      - '.github/workflows/deploy-identity.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # 🔍 DEBUG: show repo root
      - name: Debug repo root
        run: Get-ChildItem

      # 🔍 DEBUG: show services folder
      - name: Debug services folder
        run: Get-ChildItem services

      # 🔍 DEBUG: show IdentityService recursively (THIS IS THE KEY)
      - name: Debug IdentityService structure
        run: Get-ChildItem services/IdentityService -Recurse
