name: Build and deploy Identity API

on:
  push:
    branches: [ main ]
    paths:
      - 'services/IdentityService/**'
      - 'services/SportifyCore/**'
      - '.github/workflows/deploy-identity.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish Identity API
        run: dotnet publish services/IdentityService/WebAPI/WebAPI.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: identity-api
          path: publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: identity-api

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_IDENTITY }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: 'sportify-identity'
          package: .
