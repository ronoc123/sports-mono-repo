name: Build and deploy Identity Service to Azure Web App - sportify-identity

on:
  push:
    branches:
      - main
    paths:
      - 'services/IdentityService/**'
      - 'services/SportifyCore/**'
      - '.github/workflows/main_sportify-identity.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-identity-${{ hashFiles('services/IdentityService/**/*.csproj', 'services/SportifyCore/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-identity-

      # Write RSA key pair from GitHub Secrets — IdentityService needs the private key to sign JWTs
      # and the public key for its own validation/JWKS endpoint.
      # NEVER commit these files to source control.
      - name: Write RSA key pair
        run: |
          mkdir -p services/IdentityService/Keys
          echo "${{ secrets.RSA_PRIVATE_KEY }}" > services/IdentityService/Keys/private.pem
          echo "${{ secrets.RSA_PUBLIC_KEY }}"  > services/IdentityService/Keys/public.pem

      - name: Publish Identity Service
        run: dotnet publish services/IdentityService/IdentityService.csproj -c Release -o publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: identity-api
          path: publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: identity-api
          path: publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_596DB3DA232B4B3F85AC836A8B3FD954 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_13CE8B56B1D641AD97AD5ACC25439016 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9CFC05014D624733BDA4DAA95D3648BB }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sportify-identity'
          package: publish
